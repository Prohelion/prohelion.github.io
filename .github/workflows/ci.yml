name: ci
on:
  push:
    branches:
      - master
      - main
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      # Pin the same Vale version the team runs locally (vale --version).
      - name: Install Vale
        run: |
          curl -sSfL https://github.com/errata-ai/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz | tar -xz vale
          sudo mv vale /usr/local/bin/vale
          vale --version
      - name: Install script dependencies
        working-directory: scripts
        run: npm ci
      - name: Test the linter
        working-directory: scripts
        run: npm run test-lint
      # Fails the build on errors and warnings. Readability and style suggestions are only reported.
      - name: Lint the 2.3 docs
        working-directory: scripts
        run: |
          set -o pipefail
          npm run lint-docs -- --details | tee ../lint-report.txt
      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.txt
  deploy:
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Generate llms-full.txt
        working-directory: scripts
        run: |
          npm ci
          npm run generate-llms
      - run: mkdocs build --strict
      # MkDocs writes sitemap.xml.gz alongside sitemap.xml; GitHub Pages / Fastly
      # can mishandle that pair and return 500 for some sitemap fetches.
      - run: rm -f site/sitemap.xml.gz
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
