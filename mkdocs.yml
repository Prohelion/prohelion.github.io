site_name: Prohelion Documentation
site_url: https://docs.prohelion.com
site_description: >-
  Official technical documentation for Prohelion's Profinity CAN bus management
  software, Battery Management Systems, Motor Controllers, Solar Charge
  Controllers, and Solar Car Racing electronics.

# Team-only working pages (writer brief, review checklist, to-do). Excluded so they
# never reach the built site, the sitemap or the search index.
exclude_docs: |
  internal/
  Overrides/

extra_css:
  - assets/stylesheets/theme.css

theme:
  name: material
  custom_dir: docs/Overrides  
  logo: assets/images/Prohelion_Logo_32.png
  favicon: assets/favicon.ico
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.footnote.tooltips
    - navigation.footer
  palette:
    scheme: default
    primary: black
    accent: red

copyright: >
  Copyright &copy; 2016 - 2026 Prohelion Pty Ltd

plugins:
  - search
  # Downloads Google Fonts, analytics and Mermaid at build time and serves them
  # from the site, so pages don't stall waiting on external hosts when offline.
  - privacy
  - awesome-pages
  - offline
  # - with-pdf
  - spellcheck:
      backends:  # the backends you want to use
      - symspellpy

      # known_words can also be a list of words
      known_words: known_words.txt

      # ignore words in <code> tags
      ignore_code: yes

      # minimum length of words to consider
      min_length: 2

      # keep unicode characters
      allow_unicode: no

      # whether to only check in strict mode
      strict_only: no

      skip_files:
      - Battery_Management_Systems/Prohelion_BMS_D1000_Gen2/Firmware/V1.2/Configuration_Parameters.md
      - Battery_Management_Systems/Prohelion_BMS_D1000_Gen2/Firmware/V1.2/Messages_and_Signals.md


  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - custom-skip-class-name
      auto_caption: true
      caption_position: bottom
      background: white
      shadow: true

  - redirects:
      redirect_maps:
        'Battery_Management_System/index.md': 'Battery_Management_Systems/index.md'
        'Battery_Management_System/1000V_BMS_Gen1/index.md': 'Battery_Management_Systems/Prohelion_BMS_D1000_Gen1/index.md'
