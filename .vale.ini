# Prose rules for the Profinity 2.3 docs. Rules implement STYLE_GUIDE.md.
# Run through scripts/lint-docs.js, which merges these results with the structure checks.
# Third-party packages are downloaded by `vale sync` (lint-docs.js runs it when they are missing).
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft, write-good, alex, Readability

[*.md]
# Prohelion holds our own rules and is the only style that can fail a build.
BasedOnStyles = Prohelion
# Do not lint inline code, code blocks, figure/Mermaid markup, quoted software text, or bold UI labels (style guide 2.5).
TokenIgnores = (\x60[^\x60\n]+\x60), (\$\{[A-Z_:\-a-z0-9]+\}), ("[^"\n]*"), (\*\*[^*\n]+\*\*)
BlockIgnores = (?s) *(```.*?```), (?s) *(<figure.*?</figure>)

# Reviewed picks from the packages. Each is a suggestion so that it reports without failing a build.
# Not enabled, on purpose, after sampling the hits on the 2.3 docs:
#   Microsoft.Contractions  our guide bans contractions
#   Microsoft.Acronyms      fires on titles and headings
#   Microsoft.Terms         wants US spellings such as 'afterward'
#   Microsoft.Adverbs       Prohelion.Minimising already covers the useful part
#   Microsoft.Accessibility and alex.Ablist  flag 'disabled' and 'invalid', which are correct technical terms
#   write-good.TooWordy     flags 'maximum', 'minimum' and 'monitor'
#   alex.Condescending      flags 'simple' as a plain descriptor; Prohelion.Minimising covers the minimising uses
#   write-good.E-Prime, Readability.Polysyllables, alex.Suicide, and the Google package  noise
Microsoft.Passive = suggestion
Microsoft.SentenceLength = suggestion
Microsoft.Wordiness = suggestion
Microsoft.UIVerbs = suggestion

write-good.Weasel = suggestion
write-good.ThereIs = suggestion
write-good.Illusions = suggestion
write-good.Cliches = suggestion

alex.Gendered = suggestion
alex.LGBTQ = suggestion
alex.OCD = suggestion
alex.Press = suggestion
alex.ProfanityLikely = suggestion
alex.Race = suggestion

# One readability measure, to rank pages. Several would report the same thing.
Readability.FleschKincaid = suggestion
